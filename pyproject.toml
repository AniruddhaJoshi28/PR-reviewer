[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "pr-review"
version = "0.1.0"
description = "Agentic PR review pipeline for Jenkins"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "typer>=0.9,<1",
    "rich>=13,<14",
    "pyyaml>=6,<7",
    "jinja2>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pr_review.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src", "."]
